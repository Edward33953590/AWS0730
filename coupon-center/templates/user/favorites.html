{% extends "base.html" %}
{% block title %}收藏夹 - 优惠券中心{% endblock %}
{% block page_title %}收藏夹{% endblock %}
{% block content %}
<div x-data="favPage()" x-init="init()">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="f in favorites" :key="f.id">
            <div class="bg-white rounded-xl border border-slate-200 p-4 hover:shadow-md transition">
                <h3 class="font-semibold text-ink text-sm mb-3" x-text="f.campaign_name || '活动'"></h3>
                <div class="flex justify-between items-center">
                    <a href="/user/explore" class="text-xs text-primary-600 font-medium hover:underline">去领取</a>
                    <button @click="removeFav(f.id)" class="text-xs text-red-500 hover:underline">取消收藏</button>
                </div>
            </div>
        </template>
    </div>
    <div x-show="favorites.length === 0" class="text-center py-16 text-ink-muted text-sm">
        <i data-lucide="heart" class="w-10 h-10 mx-auto mb-2 text-slate-300"></i>暂无收藏
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function favPage() {
    return {
        favorites: [],
        async init() { const r = await fetch('/api/favorites'); const d = await r.json(); if (d.success) this.favorites = d.data.items || []; },
        async removeFav(id) { await fetch('/api/favorites/'+id,{method:'DELETE'}); this.favorites = this.favorites.filter(f=>f.id!==id); }
    }
}
</script>
{% endblock %}
