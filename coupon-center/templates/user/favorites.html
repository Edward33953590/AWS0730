{% extends "base.html" %}
{% block title %}收藏夹 - 优惠券中心{% endblock %}
{% block content %}
<div x-data="favPage()" x-init="init()">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">我的收藏</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="f in favorites" :key="f.id">
            <div class="bg-white rounded-lg shadow-sm border p-4">
                <h3 class="font-semibold text-gray-800 mb-2" x-text="f.campaign_name || '活动'"></h3>
                <div class="flex justify-between">
                    <a :href="'/user/explore'" class="text-sm text-primary hover:underline">去领取</a>
                    <button @click="removeFav(f.id)" class="text-sm text-red-500 hover:underline">取消收藏</button>
                </div>
            </div>
        </template>
    </div>
    <div x-show="favorites.length === 0" class="text-center py-12 text-gray-400">暂无收藏</div>
</div>
{% endblock %}
{% block scripts %}
<script>
function favPage() {
    return {
        favorites: [],
        async init() {
            const r = await fetch('/api/favorites');
            const d = await r.json();
            if (d.success) this.favorites = d.data.items || d.data;
        },
        async removeFav(id) {
            await fetch('/api/favorites/' + id, {method:'DELETE'});
            this.favorites = this.favorites.filter(f => f.id !== id);
        }
    }
}
</script>
{% endblock %}
