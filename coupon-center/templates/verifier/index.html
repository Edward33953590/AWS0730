{% extends "base.html" %}
{% block title %}核销中心 - 优惠券中心{% endblock %}
{% block page_title %}优惠券核销{% endblock %}
{% block content %}
<div x-data="verifierPage()" x-init="init()">
    <!-- Online Redeem Requests -->
    <div class="mb-8" x-show="onlineRequests.length > 0">
        <div class="flex items-center gap-2 mb-3">
            <h2 class="text-sm font-semibold text-ink">线上核销请求</h2>
            <span class="bg-amber-100 text-amber-700 text-[11px] font-bold px-2 py-0.5 rounded-full" x-text="onlineRequests.length + ' 条待处理'"></span>
        </div>
        <div class="space-y-3">
            <template x-for="req in onlineRequests" :key="req.id">
                <div class="bg-white rounded-xl border border-amber-200 p-4 flex items-center justify-between hover:shadow-sm transition">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-amber-50 text-amber-700">线上请求</span>
                            <span class="text-[11px] text-ink-muted" x-text="req.created_at ? req.created_at.substring(0,16).replace('T',' ') : ''"></span>
                        </div>
                        <p class="text-sm text-ink" x-text="req.content"></p>
                        <p class="text-xs font-mono text-primary-600 mt-1" x-text="extractCode(req.content)"></p>
                    </div>
                    <div class="ml-4 flex-shrink-0 flex gap-2">
                        <button @click="redeemOnline(req)" id="verifier_onlineredeem_button_t1u2"
                            class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold rounded-lg transition flex items-center gap-1">
                            <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>核销
                        </button>
                        <button @click="dismissRequest(req)" id="verifier_dismissreq_button_v3w4"
                            class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-ink-secondary text-xs font-medium rounded-lg transition">
                            忽略
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Redeem Card -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 max-w-xl mb-8">
        <h2 class="text-sm font-semibold text-ink mb-4">输入券码核销</h2>
        <div class="flex gap-3">
            <input x-model="couponCode" @keyup.enter="redeem()" id="verifier_couponcode_input_x3y4" placeholder="CPN-XXXXXXXX"
                class="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-base font-mono focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 outline-none transition"
            >
            <button @click="redeem()" :disabled="!couponCode || loading" id="verifier_redeem_button_z5a6"
                class="px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-lg transition disabled:opacity-40 shadow-sm flex items-center gap-2">
                <i data-lucide="check-circle" class="w-4 h-4"></i>核销
            </button>
        </div>

        <!-- Result -->
        <div x-show="result" class="mt-4 p-4 rounded-lg border" :class="resultClass">
            <div class="flex items-center gap-2 mb-1">
                <span class="font-semibold text-sm" x-text="resultTitle"></span>
            </div>
            <p class="text-xs" x-text="resultMsg"></p>
            <p x-show="result && result.campaign_name" class="text-xs mt-1 opacity-80" x-text="'活动: ' + (result?.campaign_name || '')"></p>
        </div>
    </div>

    <!-- Recent Records -->
    <div>
        <h2 class="text-sm font-semibold text-ink mb-3">最近核销记录</h2>
        <div class="bg-white rounded-xl border border-slate-200 overflow-x-auto">
            <table class="w-full min-w-[400px]">
                <thead class="bg-slate-50 border-b border-slate-200">
                    <tr>
                        <th class="px-4 py-3 text-left text-[11px] font-semibold text-ink-muted uppercase tracking-wider">时间</th>
                        <th class="px-4 py-3 text-left text-[11px] font-semibold text-ink-muted uppercase tracking-wider">券码</th>
                        <th class="px-4 py-3 text-left text-[11px] font-semibold text-ink-muted uppercase tracking-wider">活动</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <template x-for="r in records" :key="r.id">
                        <tr class="hover:bg-slate-50 transition">
                            <td class="px-4 py-3 text-xs text-ink-secondary" x-text="r.redeemed_at.substring(0,16)"></td>
                            <td class="px-4 py-3 text-xs font-mono text-ink" x-text="r.coupon_code"></td>
                            <td class="px-4 py-3 text-xs text-ink-secondary" x-text="r.campaign_name"></td>
                        </tr>
                    </template>
                </tbody>
            </table>
            <div x-show="records.length===0" class="text-center py-10 text-ink-muted text-sm">暂无核销记录</div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function verifierPage() {
    return {
        couponCode:'', loading:false,
        result:null, resultClass:'', resultTitle:'', resultMsg:'',
        records: [],
        onlineRequests: [],
        init() { this.loadRecords(); this.loadOnlineRequests(); },
        async loadOnlineRequests() {
            const r = await fetch('/api/redeem/online-requests');
            const d = await r.json();
            if (d.success) this.onlineRequests = d.data.items;
        },
        extractCode(content) {
            const match = content ? content.match(/CPN-[A-Z0-9]+/) : null;
            return match ? match[0] : '';
        },
        async redeemOnline(req) {
            const code = this.extractCode(req.content);
            if (!code) return;
            this.couponCode = code;
            await this.redeem();
            // Mark notification as read
            await fetch('/api/notifications/' + req.id + '/read', { method: 'PUT' });
            this.onlineRequests = this.onlineRequests.filter(r => r.id !== req.id);
        },
        async dismissRequest(req) {
            await fetch('/api/notifications/' + req.id + '/read', { method: 'PUT' });
            this.onlineRequests = this.onlineRequests.filter(r => r.id !== req.id);
        },
        async redeem() {
            if (!this.couponCode) return;
            this.loading=true; this.result=null;
            const r = await fetch('/api/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({coupon_code:this.couponCode.trim()})});
            const d = await r.json(); this.loading=false;
            if (d.success) {
                this.result=d.data;
                if (d.data.status==='REDEEMED') { this.resultClass='bg-emerald-50 border-emerald-200 text-emerald-800'; this.resultTitle='核销成功'; this.resultMsg='核销时间: '+d.data.redeemed_at; try { navigator.vibrate(200); } catch(e) {} }
                else if (d.data.status==='ALREADY_REDEEMED') { this.resultClass='bg-amber-50 border-amber-200 text-amber-800'; this.resultTitle='该券已核销'; this.resultMsg=d.data.message+' (首次: '+d.data.redeemed_at+')'; }
                this.loadRecords();
            } else { this.result=d.error; this.resultClass='bg-red-50 border-red-200 text-red-800'; this.resultTitle='核销失败'; this.resultMsg=d.error.message; }
            this.couponCode='';
        },
        async loadRecords() { const r=await fetch('/api/redeem/records'); const d=await r.json(); if(d.success) this.records=d.data.items; }
    }
}
</script>
{% endblock %}
