<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核销员登录 - 优惠券中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50:'#eff6ff', 100:'#dbeafe', 200:'#bfdbfe', 300:'#93c5fd', 400:'#60a5fa', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8', 800:'#1e40af', 900:'#1e3a8a' },
                        ink: { DEFAULT:'#1e293b', secondary:'#475569', muted:'#94a3b8' },
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-primary-500 to-primary-700 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm" x-data="scanLogin()" x-init="init()">
        <!-- 主卡片 -->
        <div class="bg-white rounded-2xl shadow-2xl p-6">
            <!-- 顶部 -->
            <div class="text-center mb-6">
                <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center text-white font-bold text-xl shadow-lg">券</div>
                <h1 class="text-lg font-bold text-ink">核销员登录</h1>
                <p class="text-xs text-ink-muted mt-1">请登录核销员账号以完成核销</p>
            </div>

            <!-- 券码提示 -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-center mb-4">
                <div class="text-xs text-ink-muted mb-1">待核销券码</div>
                <div class="font-mono font-bold text-ink text-base tracking-widest">{{ coupon_code }}</div>
            </div>

            <!-- 登录表单 -->
            <div class="space-y-3 mb-4">
                <div>
                    <label class="block text-xs font-medium text-ink-secondary mb-1">账号</label>
                    <input type="text" x-model="username" placeholder="请输入核销员账号"
                        class="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition"
                        @keydown.enter="loginAndRedeem()">
                </div>
                <div>
                    <label class="block text-xs font-medium text-ink-secondary mb-1">密码</label>
                    <input type="password" x-model="password" placeholder="请输入密码"
                        class="w-full px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition"
                        @keydown.enter="loginAndRedeem()">
                </div>
            </div>

            <!-- 登录并核销按钮 -->
            <button @click="loginAndRedeem()" :disabled="loading"
                class="w-full px-4 py-2.5 bg-primary-500 hover:bg-primary-600 disabled:bg-primary-300 text-white text-sm font-semibold rounded-lg transition flex items-center justify-center gap-2 mb-3">
                <template x-if="loading">
                    <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                </template>
                <span x-text="loading ? '处理中...' : '登录并核销'"></span>
            </button>

            <!-- 快速登录（演示用） -->
            <div class="text-center">
                <button @click="quickLogin()" class="text-xs text-primary-500 hover:text-primary-600 underline transition">
                    演示快速登录（verifier / verifier123）
                </button>
            </div>

            <!-- 结果提示 -->
            <div x-show="result" x-cloak x-transition class="mt-4 px-3 py-2.5 rounded-lg text-sm"
                :class="result?.type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700 border border-red-200'"
                x-text="result?.msg">
            </div>

            <!-- 登录成功后自动跳转到核销页，此处不再展示核销详情 -->
        </div>
    </div>

    <script>
    function scanLogin() {
        return {
            username: '',
            password: '',
            loading: false,
            result: null,
            couponCode: '{{ coupon_code }}',
            init() {
                this.$nextTick(() => {
                    if (window.lucide) lucide.createIcons();
                });
            },
            async quickLogin() {
                this.username = 'verifier';
                this.password = 'verifier123';
                await this.loginAndRedeem();
            },
            async loginAndRedeem() {
                if (this.loading) return; // 防重入
                if (!this.username || !this.password) {
                    this.result = { type: 'error', msg: '请输入账号和密码' };
                    return;
                }
                this.loading = true;
                this.result = null;
                try {
                    // Step 1: Login — 先登录拿到 session cookie
                    const loginRes = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            username: this.username,
                            password: this.password
                        })
                    });
                    const loginData = await loginRes.json();

                    if (!loginData.success) {
                        this.result = { type: 'error', msg: '登录失败：' + (loginData.error?.message || '账号或密码错误') };
                        this.loading = false;
                        return;
                    }

                    // 登录成功 → 在本页直接核销（不跳转，避免 cookie 时序问题）
                    // 此时 session cookie 已写入当前页面，fetch 自动携带
                    this.result = { type: 'info', msg: '登录成功，正在核销...' };
                    const redeemRes = await fetch('/api/redeem', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ coupon_code: this.couponCode })
                    });
                    const redeemData = await redeemRes.json();
                    console.log('[扫码登录] 核销结果:', JSON.stringify(redeemData));

                    if (redeemData.success) {
                        this.result = { type: 'success', msg: '核销成功！正在跳转...' };
                        // 核销成功，跳转到核销首页（此时 cookie 已在浏览器中稳定存在）
                        setTimeout(() => { window.location.href = '/verifier'; }, 1500);
                    } else {
                        const msg = redeemData.error?.message || '核销失败，请重试';
                        const code = redeemData.error?.code || '';
                        this.result = { type: 'error', msg: '核销失败：' + msg + (code ? ' [' + code + ']' : '') };
                        this.loading = false;
                    }
                } catch(e) {
                    console.error('[扫码登录] 异常:', e);
                    this.result = { type: 'error', msg: '网络错误，请检查连接后重试' };
                    this.loading = false;
                }
            }
        }
    }
    </script>
</body>
</html>
