<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码核销 - 优惠券中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50:'#eff6ff', 100:'#dbeafe', 200:'#bfdbfe', 300:'#93c5fd', 400:'#60a5fa', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8', 800:'#1e40af', 900:'#1e3a8a' },
                        ink: { DEFAULT:'#1e293b', secondary:'#475569', muted:'#94a3b8' },
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm" x-data="scanResult()" x-init="init('{{ precheck_error }}')">
        <!-- 加载状态 -->
        <div x-show="status === 'loading'" class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 text-center">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-primary-50 flex items-center justify-center">
                <svg class="animate-spin w-8 h-8 text-primary-500" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
            </div>
            <div class="text-base font-bold text-ink">正在核销...</div>
            <p class="text-sm text-ink-muted mt-1 font-mono">{{ coupon_code }}</p>
        </div>

        <!-- 核销成功 -->
        <div x-show="status === 'success'" x-cloak class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 text-center">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-emerald-50 flex items-center justify-center">
                <i data-lucide="check-circle" class="w-10 h-10 text-emerald-500"></i>
            </div>
            <div class="text-xl font-bold text-emerald-600 mb-1">核销成功 ✅</div>
            <div class="border-t border-slate-100 my-4"></div>
            <div class="text-left space-y-2 text-sm">
                <div class="flex justify-between">
                    <span class="text-ink-muted">券码</span>
                    <span class="font-mono font-semibold text-ink" x-text="result.coupon_code"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-ink-muted">活动</span>
                    <span class="font-semibold text-ink" x-text="result.campaign_name"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-ink-muted">面值</span>
                    <span class="font-semibold text-ink" x-text="result.value"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-ink-muted">核销时间</span>
                    <span class="text-ink-secondary" x-text="result.redeemed_at"></span>
                </div>
            </div>
            <div class="mt-5 space-y-2">
                <button @click="continueScan()" class="w-full px-4 py-2.5 bg-primary-500 hover:bg-primary-600 text-white text-sm font-semibold rounded-lg transition">
                    继续核销
                </button>
                <a href="/verifier" class="block w-full px-4 py-2.5 border border-slate-200 text-ink-secondary text-sm font-semibold rounded-lg hover:bg-slate-50 transition text-center">
                    回到核销首页
                </a>
            </div>
        </div>

        <!-- 已核销 / 重复核销 -->
        <div x-show="status === 'already_redeemed'" x-cloak class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 text-center">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-amber-50 flex items-center justify-center">
                <i data-lucide="alert-circle" class="w-10 h-10 text-amber-500"></i>
            </div>
            <div class="text-xl font-bold text-amber-600 mb-1">已核销 ⚠️</div>
            <p class="text-sm text-ink-muted mt-1" x-text="result.message || '此优惠券已被核销'"></p>
            <div class="mt-5">
                <button @click="continueScan()" class="px-4 py-2.5 bg-primary-500 hover:bg-primary-600 text-white text-sm font-semibold rounded-lg transition w-full">
                    继续核销
                </button>
            </div>
        </div>

        <!-- 核销失败 -->
        <div x-show="status === 'error'" x-cloak class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 text-center">
            <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-red-50 flex items-center justify-center">
                <i data-lucide="x-circle" class="w-10 h-10 text-red-500"></i>
            </div>
            <div class="text-xl font-bold text-red-600 mb-1">核销失败 ❌</div>
            <p class="text-sm text-ink-muted mt-1" x-text="errorMsg"></p>
            <p x-show="errorCode" class="text-xs text-ink-muted mt-1 font-mono" x-text="'[' + errorCode + ']'"></p>
            <div class="mt-5 space-y-2">
                <button @click="continueScan()" class="w-full px-4 py-2.5 bg-primary-500 hover:bg-primary-600 text-white text-sm font-semibold rounded-lg transition">
                    继续核销
                </button>
                <a href="/verifier" class="block w-full px-4 py-2.5 border border-slate-200 text-ink-secondary text-sm font-semibold rounded-lg hover:bg-slate-50 transition text-center">
                    手动输入核销
                </a>
            </div>
        </div>
    </div>

    <script>
    function scanResult() {
        return {
            status: 'loading',
            result: {},
            errorMsg: '',
            errorCode: '',
            _autoRedeemed: false, // 防 Alpine x-init 重复执行
            init(precheckError) {
                if (this._autoRedeemed) return; // 防重入
                console.log('[扫码核销] 页面初始化, coupon_code={{ coupon_code }}');
                this.$nextTick(() => {
                    if (window.lucide) lucide.createIcons();
                });
                if (precheckError) {
                    console.error('[扫码核销] 预检失败:', precheckError);
                    this.errorMsg = precheckError;
                    this.status = 'error';
                    return;
                }
                this.autoRedeem();
            },
            async autoRedeem() {
                if (this._autoRedeemed) return; // 防重入
                this._autoRedeemed = true;
                const couponCode = '{{ coupon_code }}';
                console.log('[扫码核销] 开始自动核销:', couponCode);
                try {
                    const res = await fetch('/api/redeem', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ coupon_code: couponCode })
                    });
                    const data = await res.json();
                    console.log('[扫码核销] API响应:', JSON.stringify(data));

                    if (data.success) {
                        this.result = {
                            coupon_code: data.data?.coupon_code || couponCode,
                            campaign_name: data.data?.campaign_name || '--',
                            value: data.data?.value || '--',
                            redeemed_at: data.data?.redeemed_at || new Date().toLocaleString()
                        };
                        if (data.data?.status === 'ALREADY_REDEEMED') {
                            // 如果已经是成功状态，不要被"已核销"覆盖
                            if (this.status === 'success') return;
                            this.status = 'already_redeemed';
                        } else {
                            this.status = 'success';
                            // 核销成功，3秒后自动跳转到核销首页
                            setTimeout(() => { window.location.href = '/verifier'; }, 3000);
                        }
                        // 振动反馈
                        try { navigator.vibrate(200); } catch(e) {}
                    } else {
                        const msg = data.error?.message || '';
                        const code = data.error?.code || '';
                        console.warn('[扫码核销] 失败:', code, msg);
                        if (msg.includes('已核销') || code === 'ALREADY_REDEEMED') {
                            this.result = { message: msg || '此优惠券已被核销' };
                            this.status = 'already_redeemed';
                        } else {
                            this.errorCode = code;
                            this.errorMsg = msg || '核销失败，请重试或手动输入券码';
                            this.status = 'error';
                        }
                    }
                } catch(e) {
                    console.error('[扫码核销] 网络异常:', e);
                    this.errorMsg = '网络请求失败，请检查网络连接';
                    this.status = 'error';
                }
                this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
            },
            continueScan() {
                window.location.href = '/verifier';
            }
        }
    }
    </script>
</body>
</html>
