{% extends "base.html" %}
{% block title %}统计面板 - 优惠券中心{% endblock %}
{% block content %}
<div x-data="dashboard()" x-init="init()">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">数据统计</h1>

    <!-- Stats Cards -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
        <div class="bg-white rounded-lg shadow-sm border p-4 text-center">
            <p class="text-3xl font-bold text-primary" x-text="stats.total_campaigns"></p>
            <p class="text-sm text-gray-500">活动数</p>
        </div>
        <div class="bg-white rounded-lg shadow-sm border p-4 text-center">
            <p class="text-3xl font-bold text-green-500" x-text="stats.total_coupons"></p>
            <p class="text-sm text-gray-500">已发券</p>
        </div>
        <div class="bg-white rounded-lg shadow-sm border p-4 text-center">
            <p class="text-3xl font-bold text-purple-500" x-text="stats.total_redeemed"></p>
            <p class="text-sm text-gray-500">已核销</p>
        </div>
        <div class="bg-white rounded-lg shadow-sm border p-4 text-center">
            <p class="text-3xl font-bold text-blue-500" x-text="stats.total_users"></p>
            <p class="text-sm text-gray-500">用户数</p>
        </div>
        <div class="bg-white rounded-lg shadow-sm border p-4 text-center">
            <p class="text-3xl font-bold text-red-500" x-text="stats.risk_blocks"></p>
            <p class="text-sm text-gray-500">风控拦截</p>
        </div>
    </div>

    <!-- Charts Row -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <div class="bg-white rounded-xl shadow-sm border p-4">
            <h3 class="font-semibold text-gray-700 mb-3">近7日领券趋势</h3>
            <canvas id="dailyChart" height="200"></canvas>
        </div>
        <div class="bg-white rounded-xl shadow-sm border p-4">
            <h3 class="font-semibold text-gray-700 mb-3">优惠券类型分布</h3>
            <canvas id="typeChart" height="200"></canvas>
        </div>
    </div>

    <!-- Rates -->
    <div class="grid grid-cols-2 gap-6">
        <div class="bg-white rounded-xl shadow-sm border p-6 text-center">
            <p class="text-5xl font-bold text-primary" x-text="(stats.claim_rate * 100).toFixed(0) + '%'"></p>
            <p class="text-gray-500 mt-2">领取率</p>
        </div>
        <div class="bg-white rounded-xl shadow-sm border p-6 text-center">
            <p class="text-5xl font-bold text-green-500" x-text="(stats.redeem_rate * 100).toFixed(0) + '%'"></p>
            <p class="text-gray-500 mt-2">核销率</p>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function dashboard() {
    return {
        stats: {total_campaigns:0,total_coupons:0,total_redeemed:0,total_users:0,risk_blocks:0,claim_rate:0,redeem_rate:0,daily_claims:[],type_distribution:[]},
        async init() {
            const r = await fetch('/api/stats/overview');
            const d = await r.json();
            if (d.success) {
                this.stats = d.data;
                this.$nextTick(() => { this.renderCharts(); });
            }
        },
        renderCharts() {
            // Daily claims chart
            const dailyCtx = document.getElementById('dailyChart');
            if (dailyCtx) {
                new Chart(dailyCtx, {
                    type: 'line',
                    data: {
                        labels: this.stats.daily_claims.map(d => d.date.substring(5)),
                        datasets: [{label: '领券数', data: this.stats.daily_claims.map(d => d.count), borderColor: '#3b82f6', tension: 0.3, fill: true, backgroundColor: 'rgba(59,130,246,0.1)'}]
                    },
                    options: {responsive: true, plugins: {legend: {display: false}}}
                });
            }
            // Type distribution chart
            const typeCtx = document.getElementById('typeChart');
            if (typeCtx) {
                const typeNames = {FULL_REDUCTION:'满减',DISCOUNT:'折扣',NO_THRESHOLD:'无门槛',ADD_ON:'加购',CATEGORY:'品类',NEWCOMER:'新人',TIME_LIMITED:'限时'};
                new Chart(typeCtx, {
                    type: 'doughnut',
                    data: {
                        labels: this.stats.type_distribution.map(d => typeNames[d.type]||d.type),
                        datasets: [{data: this.stats.type_distribution.map(d => d.count), backgroundColor: ['#ef4444','#8b5cf6','#10b981','#f97316','#3b82f6','#ec4899','#eab308']}]
                    },
                    options: {responsive: true}
                });
            }
        }
    }
}
</script>
{% endblock %}
