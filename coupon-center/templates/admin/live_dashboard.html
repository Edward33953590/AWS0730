{% extends "base.html" %}
{% block title %}实时数据大屏 - 优惠券运营指挥中心{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 -m-6 p-6" x-data="liveDashboard()">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-gradient-to-r from-cyan-400 to-blue-500 flex items-center justify-center">
                <i data-lucide="activity" class="w-5 h-5 text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white">优惠券运营指挥中心</h1>
                <p class="text-sm text-slate-400">实时数据监控</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-sm text-slate-400" x-text="'更新于 ' + lastUpdate"></span>
            <span class="flex items-center gap-1 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                实时
            </span>
            <a href="{{ url_for('admin.index') }}" class="px-4 py-2 rounded-lg bg-white/10 text-white text-sm hover:bg-white/20 transition">
                返回面板
            </a>
        </div>
    </div>

    <!-- KPI Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white/10 backdrop-blur-lg rounded-xl border border-white/10 p-5">
            <div class="flex items-center justify-between mb-2">
                <span class="text-sm text-slate-400">累计发券</span>
                <i data-lucide="ticket" class="w-4 h-4 text-cyan-400"></i>
            </div>
            <div class="text-3xl font-bold text-white" x-text="stats.total_coupons || 0"></div>
            <div class="text-xs text-emerald-400 mt-1">↑ 实时统计</div>
        </div>
        <div class="bg-white/10 backdrop-blur-lg rounded-xl border border-white/10 p-5">
            <div class="flex items-center justify-between mb-2">
                <span class="text-sm text-slate-400">累计核销</span>
                <i data-lucide="check-circle" class="w-4 h-4 text-green-400"></i>
            </div>
            <div class="text-3xl font-bold text-white" x-text="stats.total_redeemed || 0"></div>
            <div class="text-xs text-emerald-400 mt-1">↑ 实时统计</div>
        </div>
        <div class="bg-white/10 backdrop-blur-lg rounded-xl border border-white/10 p-5">
            <div class="flex items-center justify-between mb-2">
                <span class="text-sm text-slate-400">核销率</span>
                <i data-lucide="percent" class="w-4 h-4 text-amber-400"></i>
            </div>
            <div class="text-3xl font-bold text-white"><span x-text="stats.redeem_rate || 0"></span>%</div>
            <div class="text-xs text-amber-400 mt-1">目标 &gt; 50%</div>
        </div>
        <div class="bg-white/10 backdrop-blur-lg rounded-xl border border-white/10 p-5">
            <div class="flex items-center justify-between mb-2">
                <span class="text-sm text-slate-400">注册用户</span>
                <i data-lucide="users" class="w-4 h-4 text-purple-400"></i>
            </div>
            <div class="text-3xl font-bold text-white" x-text="stats.active_users || 0"></div>
            <div class="text-xs text-purple-400 mt-1">活跃用户</div>
        </div>
    </div>

    <!-- Charts Row -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
        <!-- Trend Chart -->
        <div class="lg:col-span-2 bg-white/10 backdrop-blur-lg rounded-xl border border-white/10 p-5">
            <h3 class="text-white font-semibold mb-4">24小时趋势</h3>
            <canvas id="trendChart" height="200"></canvas>
        </div>
        <!-- Type Distribution -->
        <div class="bg-white/10 backdrop-blur-lg rounded-xl border border-white/10 p-5">
            <h3 class="text-white font-semibold mb-4">券类型分布</h3>
            <canvas id="typeChart" height="200"></canvas>
        </div>
    </div>

    <!-- Real-time Feed -->
    <div class="bg-white/10 backdrop-blur-lg rounded-xl border border-white/10 p-5">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-white font-semibold">实时操作动态</h3>
            <span class="text-xs text-slate-400">最近10条</span>
        </div>
        <div class="space-y-2 max-h-64 overflow-y-auto">
            <template x-for="(op, idx) in stats.recent_operations || []" :key="idx">
                <div class="flex items-center gap-3 px-3 py-2 rounded-lg bg-white/5 border border-white/5">
                    <span class="text-xs text-cyan-400 font-mono w-16" x-text="op.time"></span>
                    <span class="px-2 py-0.5 rounded text-xs font-medium"
                          :class="op.action.includes('领取') ? 'bg-blue-500/20 text-blue-300' :
                                   op.action.includes('核销') ? 'bg-green-500/20 text-green-300' :
                                   op.action.includes('风控') ? 'bg-red-500/20 text-red-300' :
                                   'bg-slate-500/20 text-slate-300'"
                          x-text="op.action"></span>
                    <span class="text-sm text-slate-300">用户 <span class="text-white font-medium" x-text="op.user"></span></span>
                    <span class="text-sm text-slate-400" x-text="op.target"></span>
                </div>
            </template>
            <div x-show="!stats.recent_operations || stats.recent_operations.length === 0" class="text-center text-slate-500 py-8">
                暂无操作记录
            </div>
        </div>
    </div>
</div>

<script>
function liveDashboard() {
    return {
        stats: {},
        trendChart: null,
        typeChart: null,
        lastUpdate: '--:--:--',

        init() {
            this.fetchData();
            this.fetchTrend();
            setInterval(() => this.fetchData(), 3000);
            setInterval(() => this.fetchTrend(), 10000);
        },

        async fetchData() {
            try {
                const res = await fetch('/api/stats/realtime');
                const json = await res.json();
                if (json.success) {
                    this.stats = json.data;
                    this.lastUpdate = new Date().toLocaleTimeString();
                }
            } catch (e) { console.error(e); }
        },

        async fetchTrend() {
            try {
                const res = await fetch('/api/stats/trend');
                const json = await res.json();
                if (json.success) {
                    this.renderTrendChart(json.data);
                    this.renderTypeChart(json.data.type_distribution);
                }
            } catch (e) { console.error(e); }
        },

        renderTrendChart(data) {
            const ctx = document.getElementById('trendChart');
            if (!ctx) return;
            if (this.trendChart) this.trendChart.destroy();
            this.trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.hours,
                    datasets: [{
                        label: '领券',
                        data: data.claims,
                        borderColor: '#22d3ee',
                        backgroundColor: 'rgba(34,211,238,0.1)',
                        tension: 0.4, fill: true
                    }, {
                        label: '核销',
                        data: data.redeems,
                        borderColor: '#a78bfa',
                        backgroundColor: 'rgba(167,139,250,0.1)',
                        tension: 0.4, fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: '#94a3b8' } } },
                    scales: {
                        x: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        },

        renderTypeChart(dist) {
            const ctx = document.getElementById('typeChart');
            if (!ctx) return;
            if (this.typeChart) this.typeChart.destroy();
            const typeNames = {'FULL_REDUCTION':'满减','DISCOUNT':'折扣','NO_THRESHOLD':'无门槛','ADD_ON':'加购','CATEGORY':'品类','NEWCOMER':'新人','TIME_LIMITED':'限时'};
            const colors = ['#22d3ee','#a78bfa','#f472b6','#fbbf24','#34d399','#f87171','#60a5fa'];
            this.typeChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: (dist||[]).map(d => typeNames[d.type] || d.type),
                    datasets: [{
                        data: (dist||[]).map(d => d.count),
                        backgroundColor: colors.slice(0, (dist||[]).length),
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: '#94a3b8' }, position: 'bottom' } }
                }
            });
        }
    }
}
</script>
{% endblock %}
