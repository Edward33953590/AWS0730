{% extends "base.html" %}
{% block title %}排行榜 - 优惠券中心{% endblock %}
{% block page_title %}热门排行榜{% endblock %}
{% block content %}
<div x-data="rankPage()" x-init="init()">
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <table class="w-full">
            <thead class="bg-slate-50 border-b border-slate-200">
                <tr>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-ink-muted uppercase tracking-wider">排名</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-ink-muted uppercase tracking-wider">活动</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-ink-muted uppercase tracking-wider">类型</th>
                    <th class="px-4 py-3 text-right text-[11px] font-semibold text-ink-muted uppercase tracking-wider">已领取</th>
                    <th class="px-4 py-3 text-right text-[11px] font-semibold text-ink-muted uppercase tracking-wider">剩余</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <template x-for="(item, idx) in rankings" :key="item.id">
                    <tr class="hover:bg-slate-50 transition">
                        <td class="px-4 py-3">
                            <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold" :class="idx<3 ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-500'" x-text="idx+1"></span>
                        </td>
                        <td class="px-4 py-3 text-sm font-medium text-ink" x-text="item.name"></td>
                        <td class="px-4 py-3"><span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-primary-50 text-primary-600" x-text="typeLabel(item.type)"></span></td>
                        <td class="px-4 py-3 text-sm text-right font-semibold text-ink" x-text="item.claimed"></td>
                        <td class="px-4 py-3 text-sm text-right text-ink-muted" x-text="item.remaining_stock"></td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
    <div x-show="rankings.length === 0" class="text-center py-16 text-ink-muted text-sm">暂无数据</div>
</div>
{% endblock %}
{% block scripts %}
<script>
function rankPage() {
    return {
        rankings: [],
        async init() { const r = await fetch('/api/coupons/ranking'); const d = await r.json(); if (d.success) this.rankings = d.data; },
        typeLabel(t) { return {FULL_REDUCTION:'满减',DISCOUNT:'折扣',NO_THRESHOLD:'无门槛',ADD_ON:'加购',CATEGORY:'品类',NEWCOMER:'新人',TIME_LIMITED:'限时'}[t]||t; }
    }
}
</script>
{% endblock %}
