{% extends "base.html" %}
{% block title %}核销中心 - 优惠券中心{% endblock %}
{% block content %}
<div x-data="verifierPage()" x-init="init()">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">优惠券核销</h1>

    <!-- Redeem Form -->
    <div class="bg-white rounded-xl shadow-sm border p-6 max-w-lg mb-8">
        <div class="flex space-x-3">
            <input x-model="couponCode" @keyup.enter="redeem()" placeholder="请输入券码 (如: CPN-XXXXXXXX)"
                class="flex-1 px-4 py-3 border-2 rounded-lg text-lg font-mono focus:border-primary focus:ring-2 focus:ring-primary/20">
            <button @click="redeem()" :disabled="!couponCode || loading"
                class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-lg font-bold text-lg disabled:opacity-50 transition">
                核销
            </button>
        </div>

        <!-- Result -->
        <div x-show="result" class="mt-4 p-4 rounded-lg" :class="resultClass">
            <p class="font-bold" x-text="resultTitle"></p>
            <p x-text="resultMsg" class="text-sm mt-1"></p>
            <p x-show="result && result.campaign_name" class="text-sm mt-1" x-text="'活动: ' + (result?.campaign_name || '')"></p>
        </div>
    </div>

    <!-- Recent Records -->
    <div>
        <h2 class="text-lg font-bold text-gray-800 mb-4">最近核销记录</h2>
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">时间</th>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">券码</th>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">活动</th>
                    </tr>
                </thead>
                <tbody class="divide-y">
                    <template x-for="r in records" :key="r.id">
                        <tr>
                            <td class="px-4 py-3 text-sm" x-text="r.redeemed_at.substring(0,16)"></td>
                            <td class="px-4 py-3 font-mono text-sm" x-text="r.coupon_code"></td>
                            <td class="px-4 py-3 text-sm" x-text="r.campaign_name"></td>
                        </tr>
                    </template>
                </tbody>
            </table>
            <div x-show="records.length === 0" class="text-center py-8 text-gray-400">暂无核销记录</div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function verifierPage() {
    return {
        couponCode: '', loading: false,
        result: null, resultClass: '', resultTitle: '', resultMsg: '',
        records: [],
        init() { this.loadRecords(); },
        async redeem() {
            if (!this.couponCode) return;
            this.loading = true;
            this.result = null;
            const r = await fetch('/api/redeem', {
                method: 'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({coupon_code: this.couponCode.trim()})
            });
            const d = await r.json();
            this.loading = false;
            if (d.success) {
                this.result = d.data;
                if (d.data.status === 'REDEEMED') {
                    this.resultClass = 'bg-green-50 border border-green-200 text-green-800';
                    this.resultTitle = '✅ 核销成功';
                    this.resultMsg = '核销时间: ' + d.data.redeemed_at;
                } else if (d.data.status === 'ALREADY_REDEEMED') {
                    this.resultClass = 'bg-yellow-50 border border-yellow-200 text-yellow-800';
                    this.resultTitle = '⚠️ 该券已核销';
                    this.resultMsg = d.data.message + ' (首次核销: ' + d.data.redeemed_at + ')';
                }
                this.loadRecords();
            } else {
                this.result = d.error;
                this.resultClass = 'bg-red-50 border border-red-200 text-red-800';
                this.resultTitle = '❌ 核销失败';
                this.resultMsg = d.error.message;
            }
            this.couponCode = '';
        },
        async loadRecords() {
            const r = await fetch('/api/redeem/records');
            const d = await r.json();
            if (d.success) this.records = d.data.items;
        }
    }
}
</script>
{% endblock %}
