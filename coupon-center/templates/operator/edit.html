{% extends "base.html" %}
{% block title %}编辑活动 - 优惠券中心{% endblock %}
{% block page_title %}编辑活动{% endblock %}
{% block content %}
<div x-data="editCampaign()" x-init="init()">
    <div class="bg-white rounded-xl border border-slate-200 p-6 max-w-3xl" x-show="loaded">
        <form @submit.prevent="submit()">
            <div class="mb-5">
                <label class="block text-sm font-medium text-ink-secondary mb-2">活动名称</label>
                <input x-model="form.name" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 outline-none transition">
            </div>
            <div class="mb-5">
                <label class="block text-sm font-medium text-ink-secondary mb-2">描述</label>
                <textarea x-model="form.description" rows="2" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 outline-none transition resize-none"></textarea>
            </div>
            <div class="grid grid-cols-3 gap-4 mb-5">
                <div><label class="block text-sm font-medium text-ink-secondary mb-2">总库存</label><input x-model.number="form.total_stock" type="number" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm"></div>
                <div><label class="block text-sm font-medium text-ink-secondary mb-2">每人限领</label><input x-model.number="form.limit_per_user" type="number" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm"></div>
                <div><label class="block text-sm font-medium text-ink-secondary mb-2">有效天数</label><input x-model.number="form.validity_days" type="number" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm"></div>
            </div>
            <div class="mb-6 flex flex-wrap gap-5">
                <label class="flex items-center gap-2 text-sm text-ink-secondary cursor-pointer"><input type="checkbox" x-model="form.transferable" class="rounded border-slate-300 text-primary-500 focus:ring-primary-500"><span>可转赠</span></label>
                <label class="flex items-center gap-2 text-sm text-ink-secondary cursor-pointer"><input type="checkbox" x-model="form.stackable" class="rounded border-slate-300 text-primary-500 focus:ring-primary-500"><span>可叠加</span></label>
                <label class="flex items-center gap-2 text-sm text-ink-secondary cursor-pointer"><input type="checkbox" x-model="form.shareable" class="rounded border-slate-300 text-primary-500 focus:ring-primary-500"><span>可分享</span></label>
            </div>
            <div class="flex gap-3">
                <button type="submit" class="px-5 py-2.5 bg-primary-500 hover:bg-primary-600 text-white text-sm font-semibold rounded-lg transition shadow-sm">保存修改</button>
                <a href="/operator/campaigns" class="px-5 py-2.5 bg-white border border-slate-200 text-ink-secondary text-sm font-medium rounded-lg hover:bg-slate-50 transition">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function editCampaign() {
    return {
        form: {}, loaded: false,
        async init() { const id='{{ campaign_id }}'; const r=await fetch('/api/campaigns/'+id); const d=await r.json(); if(d.success){this.form=d.data;this.loaded=true;} },
        async submit() { const id='{{ campaign_id }}'; const r=await fetch('/api/campaigns/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.form)}); const d=await r.json(); if(d.success){$modal.success('保存成功').then(()=>window.location.href='/operator/campaigns');}else{$modal.error(d.error.message);} }
    }
}
</script>
{% endblock %}
