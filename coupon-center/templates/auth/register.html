{% extends "base.html" %}
{% block title %}注册 - 优惠券中心{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">优惠券中心</h1>
        <h2 class="text-lg text-center text-gray-600 mb-6">注册新账号</h2>
        <div x-data="{ loading: false }">
            <form @submit.prevent="
                loading = true;
                const formData = new FormData($el);
                fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: formData.get('username'),
                        password: formData.get('password'),
                        role: formData.get('role')
                    })
                })
                .then(r => r.json())
                .then(d => {
                    loading = false;
                    if (d.success) {
                        window.location.href = d.data.redirect;
                    } else {
                        alert(d.error.message);
                    }
                })
                .catch(() => { loading = false; alert('网络错误'); });
            ">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                    <input type="text" name="username" required minlength="3" maxlength="20"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
                        placeholder="3-20个字符">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                    <input type="password" name="password" required minlength="6" maxlength="50"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
                        placeholder="6-50个字符">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-1">角色</label>
                    <select name="role" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <option value="USER">普通用户</option>
                        <option value="OPERATOR">运营人员</option>
                        <option value="VERIFIER">核销人员</option>
                        <option value="ADMIN">管理员</option>
                    </select>
                </div>
                <button type="submit" :disabled="loading"
                    class="w-full bg-primary hover:bg-primary-dark text-white py-2 px-4 rounded-lg font-medium transition disabled:opacity-50">
                    <span x-show="!loading">注册</span>
                    <span x-show="loading">注册中...</span>
                </button>
            </form>
        </div>
        <p class="text-center text-sm text-gray-500 mt-4">
            已有账号？<a href="/login" class="text-primary hover:underline">去登录</a>
        </p>
    </div>
</div>
{% endblock %}
