{% extends "base.html" %}
{% block title %}运营中心 - 优惠券中心{% endblock %}
{% block page_title %}活动管理{% endblock %}
{% block content %}
<div x-data="campaignList()" x-init="init()">
    <div class="flex items-center justify-between mb-5">
        <p class="text-sm text-ink-muted">管理所有优惠券活动</p>
        <a href="/operator/campaigns/create" class="px-4 py-2 bg-primary-500 hover:bg-primary-600 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5 transition shadow-sm">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>创建活动
        </a>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <table class="w-full">
            <thead class="bg-slate-50 border-b border-slate-200">
                <tr>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-ink-muted uppercase tracking-wider">活动名称</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-ink-muted uppercase tracking-wider">类型</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-ink-muted uppercase tracking-wider">库存</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-ink-muted uppercase tracking-wider">状态</th>
                    <th class="px-4 py-3 text-right text-[11px] font-semibold text-ink-muted uppercase tracking-wider">操作</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <template x-for="c in campaigns" :key="c.id">
                    <tr class="hover:bg-slate-50 transition">
                        <td class="px-4 py-3 text-sm font-medium text-ink" x-text="c.name"></td>
                        <td class="px-4 py-3"><span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-primary-50 text-primary-600" x-text="typeLabel(c.type)"></span></td>
                        <td class="px-4 py-3 text-sm text-ink-secondary" x-text="c.remaining_stock+'/'+c.total_stock"></td>
                        <td class="px-4 py-3"><span class="text-[11px] font-semibold px-2 py-0.5 rounded-full" :class="c.is_active?'bg-emerald-50 text-emerald-700':'bg-slate-100 text-slate-500'" x-text="c.is_active?'进行中':'已结束'"></span></td>
                        <td class="px-4 py-3 text-right space-x-3">
                            <a :href="'/operator/campaigns/'+c.id" class="text-xs text-primary-600 font-medium hover:underline">编辑</a>
                            <button @click="del(c.id)" class="text-xs text-red-500 font-medium hover:underline">删除</button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
        <div x-show="campaigns.length===0" class="text-center py-12 text-ink-muted text-sm">暂无活动</div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function campaignList() {
    return {
        campaigns: [],
        async init() { const r=await fetch('/api/campaigns'); const d=await r.json(); if(d.success) this.campaigns=d.data.items; },
        async del(id) { if(!await $modal.confirm('确定要删除此活动吗？','删除确认')) return; const r=await fetch('/api/campaigns/'+id,{method:'DELETE'}); const d=await r.json(); if(d.success) {$modal.success('删除成功');this.init();} else $modal.error(d.error.message); },
        typeLabel(t) { return {FULL_REDUCTION:'满减',DISCOUNT:'折扣',NO_THRESHOLD:'无门槛',ADD_ON:'加购',CATEGORY:'品类',NEWCOMER:'新人',TIME_LIMITED:'限时'}[t]||t; }
    }
}
</script>
{% endblock %}
