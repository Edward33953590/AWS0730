{% extends "base.html" %}
{% block title %}通知 - 优惠券中心{% endblock %}
{% block page_title %}消息通知{% endblock %}
{% block content %}
<div x-data="notifPage()" x-init="init()">
    <div class="flex justify-end mb-4">
        <button @click="markAllRead()" class="text-xs text-primary-600 font-medium hover:underline">全部已读</button>
    </div>
    <div class="space-y-2">
        <template x-for="n in notifications" :key="n.id">
            <div class="bg-white rounded-xl border p-4 transition"
                :class="n.read ? 'border-slate-200 opacity-60' : 'border-l-4 border-l-primary-500 border-slate-200'">
                <div class="flex justify-between items-start">
                    <p class="text-sm text-ink" x-text="n.content"></p>
                    <span class="text-[11px] text-ink-muted flex-shrink-0 ml-4" x-text="n.created_at ? n.created_at.substring(0,16) : ''"></span>
                </div>
            </div>
        </template>
    </div>
    <div x-show="notifications.length===0" class="text-center py-16 text-ink-muted text-sm">
        <i data-lucide="bell-off" class="w-10 h-10 mx-auto mb-2 text-slate-300"></i>暂无通知
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function notifPage() {
    return {
        notifications: [],
        async init() {
            const r = await fetch('/api/notifications');
            const d = await r.json();
            if (d.success) this.notifications = d.data.items || [];
        },
        async markAllRead() {
            await fetch('/api/notifications/read-all', {method:'PUT'});
            this.notifications = this.notifications.map(n => ({...n, read: true}));
        }
    }
}
</script>
{% endblock %}
