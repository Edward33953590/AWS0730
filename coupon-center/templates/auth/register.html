{% extends "base.html" %}
{% block title %}注册 - 优惠券中心{% endblock %}
{% block auth_content %}
<div class="min-h-screen flex">
    <!-- Left brand panel -->
    <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden bg-gradient-to-br from-primary-600 via-primary-700 to-primary-900 flex-col justify-between p-12 text-white">
        <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle at 20% 50%, rgba(255,255,255,0.3) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,255,255,0.2) 0%, transparent 40%);"></div>
        <div class="relative z-10">
            <div class="flex items-center gap-3 mb-16">
                <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur flex items-center justify-center font-bold text-lg">券</div>
                <span class="text-xl font-bold">优惠券中心</span>
            </div>
            <h2 class="text-4xl font-bold leading-tight mb-4">加入我们<br/><span class="text-primary-200">开始领取优惠</span></h2>
            <p class="text-primary-100 text-base leading-relaxed max-w-md">注册账号即可浏览海量优惠券、享受AI个性化推荐，让每一次消费都更划算。</p>
        </div>
        <div class="relative z-10 text-xs text-primary-300">SRCG Workshop 2026</div>
    </div>

    <!-- Right form panel -->
    <div class="flex-1 flex items-center justify-center p-8 bg-slate-50">
        <div class="w-full max-w-md">
            <div class="lg:hidden flex items-center gap-3 mb-8">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center text-white font-bold text-sm">券</div>
                <span class="text-lg font-bold text-ink">优惠券中心</span>
            </div>

            <h1 class="text-2xl font-bold text-ink mb-1">创建新账号</h1>
            <p class="text-ink-muted text-sm mb-8">注册后即可开始使用优惠券系统</p>

            <div x-data="{ loading: false }">
                <form @submit.prevent="
                    loading = true;
                    fetch('/api/auth/register', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            username: $el.querySelector('[name=username]').value,
                            password: $el.querySelector('[name=password]').value,
                            role: $el.querySelector('[name=role]').value
                        })
                    })
                    .then(r => r.json())
                    .then(d => { loading = false; if (d.success) { window.location.href = d.data.redirect; } else { $modal.error(d.error.message); } })
                    .catch(() => { loading = false; $modal.error('网络错误'); });
                ">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-ink-secondary mb-2">用户名</label>
                        <input type="text" name="username" id="register_username_input_p5q6" required minlength="3" maxlength="20"
                            class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm text-ink placeholder-ink-muted focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 outline-none transition"
                            placeholder="3-20个字符">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-ink-secondary mb-2">密码</label>
                        <input type="password" name="password" id="register_password_input_r7s8" required minlength="6" maxlength="50"
                            class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm text-ink placeholder-ink-muted focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 outline-none transition"
                            placeholder="6-50个字符">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-ink-secondary mb-2">角色</label>
                        <select name="role" id="register_role_select_t9u0" required
                            class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm text-ink focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 outline-none transition appearance-none">
                            <option value="USER">普通用户</option>
                            <option value="OPERATOR">运营人员</option>
                            <option value="VERIFIER">核销人员</option>
                            <option value="ADMIN">管理员</option>
                        </select>
                    </div>
                    <button type="submit" id="register_submit_button_v1w2" :disabled="loading"
                        class="w-full py-3 bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white font-semibold rounded-xl shadow-lg shadow-primary-500/25 transition disabled:opacity-50">
                        <span x-show="!loading">注 册</span>
                        <span x-show="loading">注册中...</span>
                    </button>
                </form>
            </div>

            <p class="text-center text-sm text-ink-muted mt-6">
                已有账号？<a href="/login" class="text-primary-600 font-semibold hover:underline">去登录</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
