{% extends "base.html" %}
{% block title %}我的券包 - 优惠券中心{% endblock %}
{% block page_title %}我的券包{% endblock %}
{% block content %}
<div x-data="couponPage()" x-init="init()">
    <!-- Status Filter -->
    <div class="flex gap-2 mb-5">
        <button @click="filter=''; loadCoupons()" id="coupons_filterall_button_r0s1" :class="filter==='' ? 'bg-primary-500 text-white border-primary-500' : 'bg-white text-ink-secondary border-slate-200'" class="px-3.5 py-1.5 text-xs font-medium rounded-full border transition">全部</button>
        <button @click="filter='CLAIMED'; loadCoupons()" id="coupons_filterclaimed_button_t2u3" :class="filter==='CLAIMED' ? 'bg-primary-500 text-white border-primary-500' : 'bg-white text-ink-secondary border-slate-200'" class="px-3.5 py-1.5 text-xs font-medium rounded-full border transition">待使用</button>
        <button @click="filter='REDEEMED'; loadCoupons()" id="coupons_filterredeemed_button_v4w5" :class="filter==='REDEEMED' ? 'bg-primary-500 text-white border-primary-500' : 'bg-white text-ink-secondary border-slate-200'" class="px-3.5 py-1.5 text-xs font-medium rounded-full border transition">已核销</button>
        <button @click="filter='EXPIRED'; loadCoupons()" id="coupons_filterexpired_button_x6y7" :class="filter==='EXPIRED' ? 'bg-primary-500 text-white border-primary-500' : 'bg-white text-ink-secondary border-slate-200'" class="px-3.5 py-1.5 text-xs font-medium rounded-full border transition">已过期</button>
    </div>

    <!-- Coupon List -->
    <div class="space-y-3">
        <template x-for="c in filteredCoupons" :key="c.id">
            <div class="bg-white rounded-xl border border-slate-200 p-4 flex items-center justify-between hover:shadow-sm transition" :class="c.status !== 'CLAIMED' ? 'opacity-60' : ''">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full" :class="statusColor(c.status)" x-text="statusLabel(c.status)"></span>
                        <span class="text-[11px] text-ink-muted" x-text="typeLabel(c.campaign_type)"></span>
                    </div>
                    <h3 class="font-semibold text-ink text-sm" x-text="c.campaign_name"></h3>
                    <div class="flex items-center gap-3 text-[11px] text-ink-muted mt-1">
                        <span class="font-mono" x-text="c.coupon_code"></span>
                        <span x-text="'有效期至 ' + formatDate(c.expires_at)"></span>
                    </div>
                </div>
                <div class="ml-4 flex-shrink-0 flex gap-2">
                    <a :href="'/user/coupons/' + c.id" class="px-3 py-2 bg-primary-500 hover:bg-primary-600 text-white text-xs font-semibold rounded-lg transition flex items-center gap-1">
                        <i data-lucide="qr-code" class="w-3.5 h-3.5"></i> 详情
                    </a>
                    <button x-show="c.status === 'CLAIMED'" @click="showCode(c)" class="px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold rounded-lg transition">
                        出示券码
                    </button>
                </div>
            </div>
        </template>
    </div>
    <div x-show="filteredCoupons.length === 0" class="text-center py-16 text-ink-muted text-sm">
        <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 text-slate-300"></i>暂无优惠券
    </div>

    <!-- 出示券码弹窗 Modal -->
    <div x-show="modalOpen" x-cloak @keydown.escape.window="modalOpen=false" class="fixed inset-0 z-50 flex items-center justify-center">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/40" @click="modalOpen=false"></div>
        <!-- Modal Content -->
        <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-sm mx-4 p-6" @click.stop>
            <div class="text-center mb-4">
                <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-emerald-50 flex items-center justify-center">
                    <i data-lucide="qr-code" class="w-6 h-6 text-emerald-600"></i>
                </div>
                <h3 class="text-base font-bold text-ink">出示券码</h3>
                <p class="text-xs text-ink-muted mt-1">请向核销人员出示以下券码</p>
            </div>
            <!-- 券码显示区域 - 可全选复制 -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-center mb-4">
                <input type="text" id="coupons_code_display_input_m3n4" :value="currentCode" readonly
                    class="w-full text-center text-2xl font-mono font-bold text-ink tracking-widest bg-transparent border-none outline-none select-all cursor-text"
                    @focus="$event.target.select()" @click="$event.target.select()">
            </div>
            <!-- 复制按钮 -->
            <button @click="copyCode()" id="coupons_copycode_button_p5q6" class="w-full mb-3 px-4 py-2.5 bg-primary-500 hover:bg-primary-600 text-white text-sm font-semibold rounded-lg transition flex items-center justify-center gap-2">
                <i data-lucide="copy" class="w-4 h-4"></i>
                <span x-text="copied ? '已复制' : '复制券码'"></span>
            </button>
            <!-- 线上提交核销按钮 -->
            <template x-if="!isCurrentPending()">
                <div>
                    <button @click="submitOnlineRedeem()" id="coupons_onlineredeem_button_r7s8" :disabled="submitting" class="w-full px-4 py-2.5 bg-amber-500 hover:bg-amber-600 disabled:bg-amber-300 text-white text-sm font-semibold rounded-lg transition flex items-center justify-center gap-2">
                        <i data-lucide="send" class="w-4 h-4"></i>
                        <span x-text="submitting ? '提交中...' : '提交线上核销'"></span>
                    </button>
                    <p class="text-[11px] text-ink-muted text-center mt-2">提交后核销人员将收到通知并进行核销</p>
                </div>
            </template>
            <template x-if="isCurrentPending()">
                <div class="w-full px-4 py-2.5 bg-slate-100 border border-slate-200 text-ink-secondary text-sm font-semibold rounded-lg flex items-center justify-center gap-2">
                    <i data-lucide="clock" class="w-4 h-4 text-amber-500"></i>
                    <span>核销中，等待核销人员处理</span>
                </div>
            </template>
            <!-- 提交结果提示 -->
            <div x-show="submitMsg" x-transition class="mt-3 px-3 py-2 rounded-lg text-xs text-center" :class="submitSuccess ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200'" x-text="submitMsg"></div>
            <!-- 关闭按钮 -->
            <button @click="modalOpen=false" class="absolute top-3 right-3 w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-ink-muted transition">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function couponPage() {
    return {
        coupons: [], filter: '',
        modalOpen: false, currentCode: '', currentCouponId: '', copied: false,
        submitting: false, submitMsg: '', submitSuccess: false,
        pendingCodes: JSON.parse(localStorage.getItem('pendingRedeemCodes') || '[]'),
        init() { this.loadCoupons(); },
        get filteredCoupons() { if (!this.filter) return this.coupons; return this.coupons.filter(c => c.status === this.filter); },
        async loadCoupons() { const r = await fetch('/api/coupons/my'); const d = await r.json(); if (d.success) { this.coupons = d.data.items; this.cleanPending(); } },
        cleanPending() {
            // Remove codes that have been redeemed from pending list
            const activeCodes = this.coupons.filter(c => c.status === 'CLAIMED').map(c => c.coupon_code);
            this.pendingCodes = this.pendingCodes.filter(code => activeCodes.includes(code));
            localStorage.setItem('pendingRedeemCodes', JSON.stringify(this.pendingCodes));
        },
        isCurrentPending() {
            return this.pendingCodes.includes(this.currentCode);
        },
        showCode(coupon) {
            this.currentCode = coupon.coupon_code;
            this.currentCouponId = coupon.id;
            this.modalOpen = true;
            this.copied = false;
            this.submitMsg = '';
            this.submitSuccess = false;
            this.$nextTick(() => {
                if (window.lucide) lucide.createIcons();
                const input = document.getElementById('coupons_code_display_input_m3n4');
                if (input) input.select();
            });
        },
        async copyCode() {
            try {
                await navigator.clipboard.writeText(this.currentCode);
                this.copied = true;
                setTimeout(() => { this.copied = false; }, 2000);
            } catch(e) {
                const input = document.getElementById('coupons_code_display_input_m3n4');
                if (input) { input.select(); document.execCommand('copy'); this.copied = true; setTimeout(() => { this.copied = false; }, 2000); }
            }
        },
        async submitOnlineRedeem() {
            this.submitting = true;
            this.submitMsg = '';
            try {
                const r = await fetch('/api/coupons/submit-redeem', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ coupon_code: this.currentCode })
                });
                const d = await r.json();
                if (d.success) {
                    this.submitSuccess = true;
                    this.submitMsg = '已提交，核销人员将收到通知';
                    this.pendingCodes.push(this.currentCode);
                    localStorage.setItem('pendingRedeemCodes', JSON.stringify(this.pendingCodes));
                } else {
                    this.submitSuccess = false;
                    this.submitMsg = d.error?.message || '提交失败，请重试';
                }
            } catch(e) {
                this.submitSuccess = false;
                this.submitMsg = '网络错误，请重试';
            }
            this.submitting = false;
        },
        statusLabel(s) { return {CLAIMED:'待使用',REDEEMED:'已核销',EXPIRED:'已过期',TRANSFERRED:'已转赠'}[s]||s; },
        statusColor(s) { return {CLAIMED:'bg-emerald-50 text-emerald-700',REDEEMED:'bg-slate-100 text-slate-500',EXPIRED:'bg-red-50 text-red-600',TRANSFERRED:'bg-primary-50 text-primary-600'}[s]||'bg-slate-100'; },
        typeLabel(t) { return {FULL_REDUCTION:'满减',DISCOUNT:'折扣',NO_THRESHOLD:'无门槛',ADD_ON:'加购',CATEGORY:'品类',NEWCOMER:'新人',TIME_LIMITED:'限时'}[t]||t; },
        formatDate(d) { return d ? d.substring(0,10) : ''; }
    }
}
</script>
{% endblock %}
