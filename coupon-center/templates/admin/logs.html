{% extends "base.html" %}
{% block title %}操作日志 - 优惠券中心{% endblock %}
{% block content %}
<div x-data="logsPage()" x-init="init()">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">操作日志</h1>
    <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50"><tr>
                <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">时间</th>
                <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">操作</th>
                <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">目标</th>
                <th class="px-4 py-3 text-left text-sm font-medium text-gray-500">详情</th>
            </tr></thead>
            <tbody class="divide-y">
                <template x-for="l in logs" :key="l.id">
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 text-sm" x-text="l.created_at.substring(0,16)"></td>
                        <td class="px-4 py-3 text-sm font-medium" x-text="l.action"></td>
                        <td class="px-4 py-3 text-sm font-mono" x-text="l.target"></td>
                        <td class="px-4 py-3 text-sm text-gray-500" x-text="l.detail ? l.detail.substring(0,50) : ''"></td>
                    </tr>
                </template>
            </tbody>
        </table>
        <div x-show="logs.length === 0" class="text-center py-8 text-gray-400">暂无日志</div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function logsPage() {
    return {
        logs: [],
        async init() {
            const r = await fetch('/api/logs');
            const d = await r.json();
            if (d.success) this.logs = d.data.items;
        }
    }
}
</script>
{% endblock %}
