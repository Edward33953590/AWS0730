{% extends "base.html" %}
{% block title %}我的券包 - 优惠券中心{% endblock %}
{% block page_title %}我的券包{% endblock %}
{% block content %}
<div x-data="couponPage()" x-init="init()">
    <!-- Status Filter -->
    <div class="flex gap-2 mb-5">
        <button @click="filter=''; loadCoupons()" id="coupons_filterall_button_r0s1" :class="filter==='' ? 'bg-primary-500 text-white border-primary-500' : 'bg-white text-ink-secondary border-slate-200'" class="px-3.5 py-1.5 text-xs font-medium rounded-full border transition">全部</button>
        <button @click="filter='CLAIMED'; loadCoupons()" id="coupons_filterclaimed_button_t2u3" :class="filter==='CLAIMED' ? 'bg-primary-500 text-white border-primary-500' : 'bg-white text-ink-secondary border-slate-200'" class="px-3.5 py-1.5 text-xs font-medium rounded-full border transition">待使用</button>
        <button @click="filter='REDEEMED'; loadCoupons()" id="coupons_filterredeemed_button_v4w5" :class="filter==='REDEEMED' ? 'bg-primary-500 text-white border-primary-500' : 'bg-white text-ink-secondary border-slate-200'" class="px-3.5 py-1.5 text-xs font-medium rounded-full border transition">已核销</button>
        <button @click="filter='EXPIRED'; loadCoupons()" id="coupons_filterexpired_button_x6y7" :class="filter==='EXPIRED' ? 'bg-primary-500 text-white border-primary-500' : 'bg-white text-ink-secondary border-slate-200'" class="px-3.5 py-1.5 text-xs font-medium rounded-full border transition">已过期</button>
    </div>

    <!-- Coupon List -->
    <div class="space-y-3">
        <template x-for="c in filteredCoupons" :key="c.id">
            <div class="bg-white rounded-xl border border-slate-200 p-4 flex items-center justify-between hover:shadow-sm transition" :class="c.status !== 'CLAIMED' ? 'opacity-60' : ''">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full" :class="statusColor(c.status)" x-text="statusLabel(c.status)"></span>
                        <span class="text-[11px] text-ink-muted" x-text="typeLabel(c.campaign_type)"></span>
                    </div>
                    <h3 class="font-semibold text-ink text-sm" x-text="c.campaign_name"></h3>
                    <div class="flex items-center gap-3 text-[11px] text-ink-muted mt-1">
                        <span class="font-mono" x-text="c.coupon_code"></span>
                        <span x-text="'有效期至 ' + formatDate(c.expires_at)"></span>
                    </div>
                </div>
                <div class="ml-4 flex-shrink-0" x-show="c.status === 'CLAIMED'">
                    <button @click="showCode(c.coupon_code)" class="px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold rounded-lg transition">
                        出示券码
                    </button>
                </div>
            </div>
        </template>
    </div>
    <div x-show="filteredCoupons.length === 0" class="text-center py-16 text-ink-muted text-sm">
        <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 text-slate-300"></i>暂无优惠券
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function couponPage() {
    return {
        coupons: [], filter: '',
        init() { this.loadCoupons(); },
        get filteredCoupons() { if (!this.filter) return this.coupons; return this.coupons.filter(c => c.status === this.filter); },
        async loadCoupons() { const r = await fetch('/api/coupons/my'); const d = await r.json(); if (d.success) this.coupons = d.data.items; },
        showCode(code) { alert('请向核销人员出示券码:\n\n' + code); },
        statusLabel(s) { return {CLAIMED:'待使用',REDEEMED:'已核销',EXPIRED:'已过期',TRANSFERRED:'已转赠'}[s]||s; },
        statusColor(s) { return {CLAIMED:'bg-emerald-50 text-emerald-700',REDEEMED:'bg-slate-100 text-slate-500',EXPIRED:'bg-red-50 text-red-600',TRANSFERRED:'bg-primary-50 text-primary-600'}[s]||'bg-slate-100'; },
        typeLabel(t) { return {FULL_REDUCTION:'满减',DISCOUNT:'折扣',NO_THRESHOLD:'无门槛',ADD_ON:'加购',CATEGORY:'品类',NEWCOMER:'新人',TIME_LIMITED:'限时'}[t]||t; },
        formatDate(d) { return d ? d.substring(0,10) : ''; }
    }
}
</script>
{% endblock %}
