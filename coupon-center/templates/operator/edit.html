{% extends "base.html" %}
{% block title %}编辑活动 - 优惠券中心{% endblock %}
{% block content %}
<div x-data="editCampaign()" x-init="init()">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">编辑活动</h1>
    <div class="bg-white rounded-xl shadow-sm border p-6 max-w-3xl" x-show="loaded">
        <form @submit.prevent="submit()">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">活动名称</label>
                <input x-model="form.name" class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                <textarea x-model="form.description" rows="2" class="w-full px-3 py-2 border rounded-lg"></textarea>
            </div>
            <div class="grid grid-cols-3 gap-4 mb-4">
                <div><label class="block text-sm text-gray-700 mb-1">总库存</label><input x-model.number="form.total_stock" type="number" class="w-full px-3 py-2 border rounded-lg"></div>
                <div><label class="block text-sm text-gray-700 mb-1">每人限领</label><input x-model.number="form.limit_per_user" type="number" class="w-full px-3 py-2 border rounded-lg"></div>
                <div><label class="block text-sm text-gray-700 mb-1">有效天数</label><input x-model.number="form.validity_days" type="number" class="w-full px-3 py-2 border rounded-lg"></div>
            </div>
            <div class="mb-6 flex flex-wrap gap-4">
                <label class="flex items-center space-x-2 text-sm"><input type="checkbox" x-model="form.transferable" class="rounded"><span>可转赠</span></label>
                <label class="flex items-center space-x-2 text-sm"><input type="checkbox" x-model="form.stackable" class="rounded"><span>可叠加</span></label>
                <label class="flex items-center space-x-2 text-sm"><input type="checkbox" x-model="form.shareable" class="rounded"><span>可分享</span></label>
            </div>
            <div class="flex space-x-3">
                <button type="submit" class="bg-primary text-white px-6 py-2 rounded-lg">保存修改</button>
                <a href="/operator/campaigns" class="px-6 py-2 border rounded-lg text-gray-600">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function editCampaign() {
    return {
        form: {}, loaded: false,
        async init() {
            const id = '{{ campaign_id }}';
            const r = await fetch('/api/campaigns/' + id);
            const d = await r.json();
            if (d.success) { this.form = d.data; this.loaded = true; }
        },
        async submit() {
            const id = '{{ campaign_id }}';
            const r = await fetch('/api/campaigns/' + id, {
                method: 'PUT', headers:{'Content-Type':'application/json'},
                body: JSON.stringify(this.form)
            });
            const d = await r.json();
            if (d.success) { alert('保存成功'); window.location.href = '/operator/campaigns'; }
            else { alert(d.error.message); }
        }
    }
}
</script>
{% endblock %}
